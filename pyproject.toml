[project]
name = "document-intelligence-pipeline"
version = "0.1.0"
description = "Turns messy contracts into validated, evidence-grounded JSON records, measured against CUAD."
readme = "README.md"
authors = [{ name = "Vijay Bhore", email = "bhore.vijay@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "openinference-instrumentation-openai>=0.1.65",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "pypdf>=6.21.1",
    "rapidfuzz>=3.14.6",
    "tiktoken>=0.14.0",
    "typer>=0.27.3",
]

[project.scripts]
dip = "dip.cli:app"

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.12"

[tool.uv.build-backend]
module-name = "dip"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs"]  # spec code blocks are illustrative sketches, not source

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "SIM",     # simplify
  "RUF",     # ruff-specific
  "PT",      # pytest style
  "S",       # bandit (security)
  "N",       # naming
  "C4",      # comprehensions
  "DTZ",     # timezone-aware datetimes
  "PTH",     # pathlib over os.path
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",  # assert is how pytest works
  "S311",  # seeded random.Random is fine for sampling tests
  "S608",  # SQL over tmp_path files, no user input
]

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnnecessaryTypeIgnoreComment = "warning"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not integration and not llm"]
markers = [
  "integration: needs emulators or network; excluded from the default run",
  "llm: calls a real LLM API and costs money; excluded from the default run",
  "cuad: needs the downloaded CUAD dataset; skips itself when data/raw/CUAD_v1 is absent",
]

[tool.coverage.run]
source = ["dip"]
branch = true

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
