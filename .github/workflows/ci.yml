name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs: a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest --cov --cov-report=term-missing

  image:
    # Builds the service image (no push; Phase 8 publishes it) and smoke-tests both roles.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Build
        run: docker build -f docker/Dockerfile -t dip:ci .

      - name: Smoke test
        run: |
          for role in api worker; do
            docker run -d --name "$role" -e DIP_ROLE="$role" -p 127.0.0.1::8080 dip:ci
            port=$(docker port "$role" 8080 | head -1 | cut -d: -f2)
            curl -fsS --retry 20 --retry-all-errors --retry-delay 1 "http://127.0.0.1:$port/healthz"
            echo " <- $role"
          done
          docker run --rm --entrypoint id dip:ci -u | grep -qx 10001
